[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "host-helper"
version = "0.1.0"
description = "Vacation rental calendar synchronization and maintenance reminders"
readme = "README.md"
requires-python = ">=3.11"
keywords = ["vacation-rental", "automation", "calendar", "google-tasks"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business :: Scheduling",
]
dependencies = [
  "icalendar>=6,<8",
  "requests>=2.32,<3",
  "python-dotenv>=1,<2",
  "google-api-python-client>=2,<3",
  "google-auth>=2,<3",
  "google-auth-httplib2>=0.2,<1",
  "google-auth-oauthlib>=1,<2",
]

[project.optional-dependencies]
dev = ["build>=1,<2", "ruff==0.16.10", "pre-commit>=4,<5"]

[project.scripts]
host-helper = "host_helper.cli:main"

[project.urls]
Repository = "https://github.com/Satoshilab21/host-helper"
Issues = "https://github.com/Satoshilab21/host-helper/issues"

[tool.setuptools.packages.find]
include = ["host_helper*"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
